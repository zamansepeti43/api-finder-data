name: Sync Free AI API Data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/sync-free-ai-api-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
      timezone: 'Europe/Istanbul'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4

      - name: Fetch and merge continuously maintained provider datasets
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the app-compatible provider feed
        run: node scripts/sync-providers.js

      - name: Commit sync results
        run: |
          git config user.name 'AGT Studioco Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json update-manifest.json sync-status.json
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m "chore: sync verified free and trial API providers"
          git push
